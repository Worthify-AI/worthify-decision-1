name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: (cd results/raw && sha256sum -c SHA256SUMS)
      - run: python benchmarks/verify_published.py
      - run: python benchmarks/verify_decision_1.py
      - run: python scripts/verify_snapshot.py
      - run: worthify-lora --help
